name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, check, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/maa-flutes

            # Pull latest code
            git pull origin main

            # Rebuild and restart Next.js container only (Supabase is separate)
            docker compose -f docker/docker-compose.yml build nextjs
            docker compose -f docker/docker-compose.yml up -d nextjs

            # Remove dangling images to save disk space
            docker image prune -f

            echo "Deployment complete."
