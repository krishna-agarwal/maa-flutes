# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name maaflutes.com www.maaflutes.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main app — HTTPS
server {
    listen 443 ssl http2;
    server_name maaflutes.com www.maaflutes.com;

    ssl_certificate     /etc/letsencrypt/live/maaflutes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maaflutes.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location /_next/static/ {
        proxy_pass http://nextjs:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        proxy_pass http://nextjs:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy everything else to Next.js
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for SSR pages with external API calls
        proxy_read_timeout 30s;
    }
}

# Supabase API — separate subdomain
server {
    listen 443 ssl http2;
    server_name supabase.maaflutes.com;

    ssl_certificate     /etc/letsencrypt/live/maaflutes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maaflutes.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # Supabase Kong gateway runs on host port 8000
        # Using host.docker.internal to reach host from within Docker
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase for file uploads via Supabase Storage
        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }
}
